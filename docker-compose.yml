services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  server:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - PORT=4000
    ports:
      - "4000:4000"
    depends_on:
      - mongo

  client:
    build:
      context: ./client
      args:
        VITE_BASE_URL: ${VITE_BASE_URL}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        VITE_TURN_USERNAME: ${VITE_TURN_USERNAME}
        VITE_TURN_CREDENTIAL: ${VITE_TURN_CREDENTIAL}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo_data: